<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1a3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Durip">
<meta name="application-name" content="Durip">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Durip</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Allura&display=swap">
<style>
/* Layout: phone app — starry header, scrolling content, fixed bottom tab bar, bottom sheet for editing. Single light look (matches the mock). */
:root{
  --sky:#0b1a3a; --sky2:#1b3466; --navy:#163a6b; --ink:#12284d; --sub:#5b6b85; --mute:#8a97ab;
  --bg:#f4f6fa; --card:#ffffff; --pill:#dfe9f6; --soft:#eef3fa; --line:#e6ebf2; --coral:#e8796a; --peach:#fbe3da; --danger:#b3261e;
  --display:'Allura',cursive; --body:'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sky)}
button,input,textarea,select{font-family:inherit;color:inherit;font-size:15px}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.app{background:var(--bg);min-height:100%;display:flex;flex-direction:column;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.sky{color:#fff;background-color:var(--sky);
  background-image:radial-gradient(1.5px 1.5px at 8% 20%,#fff,transparent),radial-gradient(1px 1px at 30% 55%,#fff,transparent),radial-gradient(1.5px 1.5px at 66% 18%,#fff,transparent),radial-gradient(1px 1px at 86% 62%,#fff,transparent),radial-gradient(1px 1px at 50% 80%,#cfe0ff,transparent),radial-gradient(1px 1px at 18% 85%,#cfe0ff,transparent),linear-gradient(180deg,#0a1633 0%,var(--sky2) 100%)}
header.sky{position:relative;padding-block:28px 34px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.hin{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.script{font-family:var(--display);font-size:34px;line-height:1.1;padding-right:52px;text-wrap:balance}
.hdate{font-size:20px;font-weight:500;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.hsub{font-size:14px;opacity:.9;display:flex;align-items:center;gap:6px}
.fab[hidden]{display:none}
.mapc.lf{display:block;padding:0;position:relative;z-index:0}
.pinm span{display:flex;width:30px;height:30px;border-radius:50%;background:#163a6b;color:#fff;font:700 13px/1 'Noto Sans JP',sans-serif;align-items:center;justify-content:center;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3);box-sizing:border-box}
.pinm.last span{background:#e8796a}
.leaflet-container{font-family:inherit}
.splash{position:fixed;inset:0;z-index:100;background:linear-gradient(180deg,#1b3466,#0b1a3a);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;font-family:'Noto Sans JP','Hiragino Sans',system-ui,sans-serif}
.spl-ic{width:116px;height:116px;animation:splpop .7s cubic-bezier(.2,1.4,.4,1) both}
.spl-pl{animation:splfly 1.1s cubic-bezier(.3,.9,.3,1) both;transform-origin:300px 196px}
.spl-trail{animation:spltr 1.1s ease-out both}
.spl-t{font-size:40px;font-weight:700;letter-spacing:.02em;line-height:1;animation:splup .6s .18s cubic-bezier(.2,.9,.3,1) both}
.spl-s{font-size:13px;font-weight:500;opacity:.7;letter-spacing:.2em;animation:splup .6s .3s cubic-bezier(.2,.9,.3,1) both}
.splash.out{animation:splout .5s cubic-bezier(.4,0,.2,1) forwards}
.splash.out .spl-pl{animation:splaway .5s ease-in forwards}
@keyframes splpop{from{opacity:0;transform:scale(.7)}}
@keyframes splfly{from{opacity:0;transform:translate(-70px,60px)}}
@keyframes spltr{from{opacity:0}}
@keyframes splup{from{opacity:0;transform:translateY(10px)}}
@keyframes splout{to{opacity:0;transform:scale(1.06);visibility:hidden}}
@keyframes splaway{to{transform:translate(90px,-80px);opacity:0}}
@media (prefers-reduced-motion:reduce){.splash *,.splash{animation-duration:.01s!important;animation-delay:0s!important}}
.apph{flex-direction:row!important;align-items:flex-end;justify-content:space-between;gap:12px}
.apph-t{display:flex;flex-direction:column;gap:4px;min-width:0}
.apph-e{font-size:12px;font-weight:500;opacity:.75;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.apph h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.01em;line-height:1.2}
.apph-b{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
header.sky:has(.apph){padding-block:22px 34px}
.hbtn{position:absolute;top:22px;right:max(14px,env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none}
main{flex:1;margin-top:-18px;background:var(--bg);border-radius:20px 20px 0 0;padding-block:16px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.seg{align-self:center;display:flex;gap:2px;max-width:100%;overflow-x:auto;background:var(--pill);border-radius:999px;padding:3px}
.seg button{flex:none;min-width:96px;height:40px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:var(--navy);font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.chip{align-self:flex-start;background:var(--pill);color:var(--navy);font-size:14px;font-weight:700;padding:5px 14px;border-radius:999px;margin:0}
.row{display:grid;grid-template-columns:78px minmax(0,1fr);gap:6px}
.time{background:var(--card);border-radius:12px;display:flex;align-items:center;padding:0 8px 0 12px;font-weight:700;font-size:14px;white-space:pre-line;font-variant-numeric:tabular-nums;line-height:1.25}
.item{background:var(--card);border:0;border-radius:12px;min-height:62px;display:flex;align-items:center;gap:12px;padding:8px 12px;text-align:left;cursor:pointer;width:100%}
.ico{flex:none;width:34px;height:34px;border-radius:10px;background:var(--soft);color:var(--navy);display:flex;align-items:center;justify-content:center}
.ico svg{width:20px;height:20px}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.t1{font-weight:700}.t2{font-size:12.5px;color:var(--sub);overflow-wrap:anywhere}
.chev{flex:none;color:var(--navy);transition:transform .2s}
.item[aria-expanded="true"] .chev{transform:rotate(90deg)}
.detail{grid-column:2;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6;display:flex;flex-direction:column;gap:8px;overflow-wrap:anywhere}
.link{background:none;border:0;padding:0;color:var(--navy);font-weight:700;font-size:13px;text-decoration:underline;cursor:pointer;align-self:flex-start;min-height:32px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--peach);color:var(--ink);border-radius:999px;padding:12px 18px;font-weight:700;font-size:14px;text-decoration:none;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(18,40,77,.18);z-index:5}
.card{background:var(--card);border-radius:16px;box-shadow:0 1px 4px rgba(18,40,77,.06)}
.btn{min-height:48px;border-radius:14px;border:0;background:var(--navy);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;cursor:pointer;padding:0 16px}
.btn.ghost{background:transparent;border:1.5px dashed #9fb1c9;color:var(--navy)}
.btn.line{background:var(--card);border:1.5px solid var(--line);color:var(--navy)}
.btn.warn{background:var(--card);border:1.5px solid var(--danger);color:var(--danger)}
.btn.warn.sure{background:var(--danger);color:#fff}
.note{font-size:12px;color:var(--sub);margin:0}
.empty{padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
/* trips list */
.trip{display:flex;align-items:center;gap:14px;padding:14px 16px;border:0;width:100%;text-align:left;cursor:pointer}
.trip .badge{flex:none;width:52px;height:52px;border-radius:14px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.trip .badge small{font-size:10px;font-weight:500;opacity:.85}
.cur{font-size:11px;font-weight:700;color:var(--coral)}
/* map */
.stop{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.stop:last-child{border-bottom:0}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.stop:last-child .num{background:var(--coral)}
.out{flex:none;color:var(--navy);width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px}
.route{position:relative;height:120px;border-radius:16px;overflow:hidden;background:#e3ebf2}
.route svg{position:absolute;inset:0;width:100%;height:100%}
/* packing */
.prog{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden}
.bar div{height:100%;border-radius:4px;background:#f6c9b8;transition:width .3s}
.check{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 6px 0 16px;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:20px;height:20px;accent-color:var(--navy);margin:0;flex:none}
.check .lb{flex:1;min-width:0;overflow-wrap:anywhere}
.check input:checked + .lb{color:#9aa6b8;text-decoration:line-through}
.who{font-size:11px;color:var(--sub)}
.del{border:0;background:none;color:var(--mute);width:40px;height:40px;border-radius:8px;cursor:pointer;font-size:18px}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:8px}
/* memories */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#dfe6ef;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(11,26,58,.6);color:#fff;cursor:pointer}
.addph{position:relative;aspect-ratio:1;border-radius:10px;border:1.5px dashed #9fb1c9;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;color:var(--navy);cursor:pointer;font-size:11px}
.addph input{position:absolute;width:1px;height:1px;opacity:0}
/* forms */
.f{display:flex;flex-direction:column;gap:6px}
.f label{font-size:12px;font-weight:700;color:var(--sub)}
.in{width:100%;box-sizing:border-box;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}
textarea.in{min-height:84px;resize:vertical;line-height:1.6}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.icons{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.icons button{aspect-ratio:1;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--navy);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.icons button svg{width:20px;height:20px}
.icons button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(11,26,58,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88%;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding-block:12px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
.scrim{animation:scin .22s ease-out}
.scrim .sheet{animation:shup .38s cubic-bezier(.18,.95,.32,1.08)}
.scrim.swap,.scrim.swap .sheet{animation:none}
.scrim.closing{animation:scout .23s ease-in forwards;pointer-events:none}
.scrim.closing .sheet{animation:shdown .23s ease-in forwards}
@keyframes scin{from{background:rgba(11,26,58,0)}}
@keyframes scout{to{background:rgba(11,26,58,0)}}
@keyframes shup{from{transform:translateY(100%)}}
@keyframes shdown{to{transform:translateY(100%)}}
.grab{width:44px!important;height:5px!important;padding:6px 0;background-clip:content-box;touch-action:none;cursor:grab;align-self:center;width:40px;height:4px;border-radius:2px;background:#cbd5e2}
.sheet h2{margin:0;font-size:18px}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
/* tab bar */
.next{position:relative;overflow:hidden;padding:20px 20px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:6px 14px;border:0;text-align:left;cursor:pointer;width:100%;color:#fff;border-radius:20px;box-shadow:0 10px 26px rgba(11,26,58,.25)}
.next .eyebrow{grid-column:1/-1;font-size:11px;font-weight:700;letter-spacing:.18em;opacity:.75}
.next .nt{display:flex;flex-direction:column;gap:4px;min-width:0}
.next .nm{font-family:var(--display);font-size:32px;line-height:1.05;overflow-wrap:anywhere}
.next .nd{font-size:12.5px;opacity:.85;font-variant-numeric:tabular-nums}
.next .cd{display:flex;flex-direction:column;align-items:center;justify-content:center;width:92px;height:92px;border-radius:50%;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.next .cd b{font-size:36px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.next .cd small{font-size:11px;opacity:.85;margin-top:3px}
.next .tdo{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:12px;border-top:1px solid rgba(255,255,255,.18);font-size:12.5px}
.next .tdo i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.next .tdo i span{display:block;height:100%;background:#f6c9b8;border-radius:3px}
.todo{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 6px 0 16px;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.todo input{width:20px;height:20px;accent-color:var(--navy);margin:0;flex:none}
.todo label{flex:1;min-width:0;cursor:pointer;overflow-wrap:anywhere;padding:12px 0}
.todo input:checked + label{color:#9aa6b8;text-decoration:line-through}
.gt{padding:4px 0 6px;display:flex;flex-direction:column}
.gt-acts{display:flex;gap:8px;flex-wrap:wrap}
.gt-chip{min-height:34px;padding:0 16px;border-radius:999px;border:1px solid #c9d4e2;background:var(--card);color:var(--ink);font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.gt-chip.ic{padding:0 10px;color:var(--sub)}
.gt-duew{display:inline-flex;align-items:center;gap:2px;align-self:flex-start;margin-top:8px}
.gt-due{display:inline-flex;align-items:center;gap:5px;min-height:30px;padding:0 12px;border-radius:999px;border:1px solid #c9d4e2;background:var(--card);color:#2463b0;font-size:12.5px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.gt-due.over{color:#c0392b;border-color:#f0c4bd}
.gt-x{width:30px;height:30px;border:0;background:none;color:var(--mute);font-size:16px;cursor:pointer;border-radius:50%}
.dp{display:flex;flex-direction:column;gap:6px}
.dp-h{display:flex;align-items:center;justify-content:space-between;padding:4px 2px}
.dp-m{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.dp-w,.dp-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));justify-items:center}
.dp-w span{font-size:12px;font-weight:700;color:var(--sub);padding:6px 0}
.dp-d{width:40px;height:40px;border-radius:50%;border:0;background:none;color:var(--ink);font-size:14px;cursor:pointer;font-variant-numeric:tabular-nums}
.dp-d.out{color:#b5bfcd}
.dp-d.today{box-shadow:inset 0 0 0 2px #2463b0;color:#2463b0;font-weight:700}
.dp-d.sel{background:#2463b0;color:#fff;font-weight:700;box-shadow:none}
.dp-row{display:flex;align-items:center;gap:14px;min-height:56px;border-top:1px solid var(--line)}
.dp-row:first-of-type{margin-top:6px}
.dp-ic{flex:none;width:24px;color:var(--sub);display:flex;justify-content:center}
.dp-time{flex:1;display:flex;align-items:center;gap:6px}
.dp-time input{flex:1;font-size:17px;font-weight:700;text-align:center}
.dp-tbtn{flex:1;min-height:48px;border-radius:10px;border:0;background:var(--soft);color:var(--sub);font-size:15px;text-align:left;padding:0 14px;cursor:pointer}
.dp-rep{flex:1;border:0;background:transparent;font-size:15px;font-weight:700;padding-left:0}
.dp-a{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.dp-b{min-height:44px;padding:0 18px;border-radius:999px;border:0;background:none;color:#2463b0;font-size:15px;font-weight:700;cursor:pointer}
.dp-b.pri{background:#2463b0;color:#fff;padding:0 26px}
.ev.task{background:transparent;color:#2463b0;box-shadow:inset 0 0 0 1px #2463b0;font-weight:700}
.ev.task.done{opacity:.5;text-decoration:line-through}
.tkrow{padding:0 6px 0 4px!important;cursor:default}
.dsh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dsh h2{font-size:22px!important;letter-spacing:.01em}
.dsh-b{display:flex;gap:10px}
.rb{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--navy);display:flex;align-items:center;justify-content:center;cursor:pointer}
.rb.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.dsh-empty{margin:0;padding:64px 0 72px;text-align:center;color:var(--mute);font-size:15px}
.sheet.day{min-height:46%}
.sheet.full{min-height:92%;max-height:94%;padding-top:10px}
.ttw{display:flex;flex-direction:column}
.tt-top{display:flex;justify-content:space-between;align-items:center;padding:4px 0 6px}
.tt-x{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.tt-save{min-height:46px;padding:0 26px;border-radius:999px;border:0;background:var(--navy);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.tt-title{border:0;background:transparent;font-size:28px;font-weight:700;color:var(--ink);padding:14px 4px 18px 52px;outline:none;border-bottom:1px solid var(--line);width:100%;box-sizing:border-box}
.tt-title::placeholder{color:#b5bfcd}
.tt-row{display:flex;align-items:center;gap:14px;min-height:60px;border-bottom:1px solid var(--line);padding:0 2px;box-sizing:border-box;width:100%}
.tt-row.sub{border-bottom:0;min-height:56px;padding-left:38px}
.tt-row.top{align-items:flex-start;padding-top:12px;padding-bottom:12px}
.tt-btn{border-left:0;border-right:0;border-top:0;background:none;color:inherit;text-align:left;cursor:pointer;font:inherit}
.tt-i{flex:none;width:24px;color:var(--sub);display:flex;justify-content:center}
.tt-l{flex:1;min-width:0;font-size:16px;font-weight:500;display:flex;align-items:center}
.tt-l .avs{margin-left:0}.tt-l .av{width:30px;height:30px;font-size:13px}
.tt-ph{color:var(--mute)}
.tt-v{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:15px}

function md(s){var d=D(s);return (d.getMonth()+1)+'/'+d.getDate()}

  else if(days[i])st=itemsOn(days[i]).filter(function(x){return x.place});

function drawMap(stops){

async function geocode(list){
  var t=trip(),ok=0;
  for(var i=0;i<list.length;i++){var it=list[i];
    try{
      var qs=[it.place,it.place+' '+((t&&t.place)||'').replace(/[（(].*?[）)]/g,'')];
      for(var k=0;k<qs.length;k++){
        var r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=ja&q='+encodeURIComponent(qs[k]));var a=await r.json();
        if(a&&a[0]){await col('items').doc(it.id).update({lat:+a[0].lat,lng:+a[0].lon});ok++;break}
        await new Promise(function(z){setTimeout(z,1100)});
      }
    }catch(e){}
    await new Promise(function(z){setTimeout(z,1100)});
  }
  if(ok<list.length)toast(ok?'一部の場所は位置を特定できませんでした':'位置を特定できませんでした。場所の名前を詳しくしてお試しください');

}

  var h='<h2>'+(m?'メンバーを編集':'メンバーを追加')+'</h2><div class="f"><label for="mb_n">名前</label><input class="in" id="mb_n" value="'+esc(m?m.name:'')+'" placeholder="例：マサト"></div>'+
    '<div class="f"><span class="lab">色</span><div class="sw" role="group" aria-label="色">'+MCOL.concat(EV_COLORS.filter(function(c){return MCOL.indexOf(c)<0})).map(function(c,i){return '<button type="button" data-c="'+c+'" style="background:'+c+'" aria-pressed="'+(c===color)+'" aria-label="色'+(i+1)+'"></button>'}).join('')+'</div></div>'+
    '<div class="tt-row" style="border-bottom:0;padding:0"><label class="tt-l" for="mb_fix" style="flex-direction:column;align-items:flex-start;gap:2px"><span>この人の色で予定を表示</span><span class="note">担当になった予定の色を、この人の色に固定します</span></label><input type="checkbox" role="switch" class="tgl" id="mb_fix"'+(m&&m.fixColor?' checked':'')+'></div>'+
    '<div class="acts"><button class="btn line" data-close>閉じる</button><button class="btn" id="mb_s">保存する</button></div>'+(m?'<button class="btn warn" id="mb_d">このメンバーを削除</button>':'');
  openSheet(h,function(){
    sheetRoot.querySelectorAll('[data-c]').forEach(function(b){b.onclick=function(){color=b.dataset.c;sheetRoot.querySelectorAll('[data-c]').forEach(function(x){x.setAttribute('aria-pressed',x===b)})}});
    document.getElementById('mb_s').onclick=function(){var n=document.getElementById('mb_n').value.trim();if(!n){toast('名前を入力してください');return}
      var body={name:n,color:color,fixColor:document.getElementById('mb_fix').checked};if(!m)body.order=S.members.length+1;
      (m?S.db.doc('members/'+m.id).update(body):S.db.collection('members').add(body)).then(function(){closeSheet();toast('保存しました')}).catch(fail)};
    var d=document.getElementById('mb_d');if(d)d.onclick=function(){if(!d.classList.contains('sure')){d.classList.add('sure');d.textContent='本当に削除する';return}
      S.db.doc('members/'+m.id).delete().then(function(){closeSheet();toast('削除しました')}).catch(fail)};
  });
}
function findTd(tid,id){return (allTd[tid]||[]).filter(function(x){return x.id===id})[0]}
function taskSheet(tid,x,date){
  var trs=S.trips.slice().sort(function(a,b){return D(a.start)-D(b.start)});
  var defT=tid||(trip()&&trip().id)||(trs[0]&&trs[0].id),who=((x&&x.who)||[]).slice();
  var h='<h2>'+(x?'タスクを編集':'タスクを追加')+'</h2>'+
   '<div class="f"><label for="tk_t">タイトル</label><input class="in" id="tk_t" value="'+esc(x?x.text:'')+'" placeholder="例：レンタカーを予約する"></div>'+
   '<div class="f"><span class="lab">担当</span>'+mpHtml(who)+'</div>'+
   '<div class="f"><label for="tk_n">詳細</label><textarea class="in" id="tk_n" placeholder="詳細">'+esc(x?x.notes||'':'')+'</textarea></div>'+
   '<div class="two"><div class="f"><label for="tk_d">日付</label><input class="in" type="date" id="tk_d" value="'+esc(x?x.due||'':date)+'"></div>'+
   '<div class="f"><label for="tk_h">時刻（空欄で終日）</label><input class="in" type="time" id="tk_h" value="'+esc(x?x.dueTime||'':'')+'"></div></div>'+
   '<div class="two"><div class="f"><label for="tk_r">繰り返し</label><select class="in" id="tk_r">'+Object.keys(REPEAT).map(function(k){return '<option value="'+k+'"'+(x&&x.repeat===k?' selected':'')+'>'+REPEAT[k]+'</option>'}).join('')+'</select></div>'+
   '<div class="f"><label for="tk_trip">旅行</label><select class="in" id="tk_trip"'+(x?' disabled':'')+'>'+trs.map(function(t){return '<option value="'+esc(t.id)+'"'+(t.id===defT?' selected':'')+'>'+esc(t.title)+'</option>'}).join('')+'</select></div></div>'+
   (x?'<label class="qchk" for="tk_done" style="align-self:flex-start"><input type="checkbox" id="tk_done"'+(x.done?' checked':'')+'>完了</label>':'')+
   '<div class="acts"><button class="btn line" data-close>閉じる</button><button class="btn" id="tk_s">保存する</button></div>'+
   (x?'<button class="btn warn" id="tk_del">このタスクを削除</button>':'');
  openSheet(h,function(){
    mpBind(sheetRoot,who);
    document.getElementById('tk_s').onclick=function(){
      var v=document.getElementById('tk_t').value.trim();if(!v){toast('タイトルを入力してください');return}
      var body={text:v,who:who,notes:document.getElementById('tk_n').value.trim(),due:document.getElementById('tk_d').value,dueTime:document.getElementById('tk_h').value,repeat:document.getElementById('tk_r').value};
      if(!body.due){body.dueTime='';body.repeat=''}
      var p;
      if(x){var dn=document.getElementById('tk_done').checked;body.done=dn;if(dn&&!x.done)body.doneAt=Date.now();p=S.db.doc('trips/'+tid+'/todos/'+x.id).update(body)}
      else{var t2=document.getElementById('tk_trip').value,mn=0;(allTd[t2]||[]).forEach(function(y){if(!y.done)mn=Math.min(mn,y.order||0)});
        body.done=false;body.order=mn-1;p=S.db.collection('trips/'+t2+'/todos').add(body)}
      p.then(function(){closeSheet();toast('保存しました')}).catch(fail);
    };
    var del=document.getElementById('tk_del');
    if(del)del.onclick=function(){var ref=S.db.doc('trips/'+tid+'/todos/'+x.id),keep=Object.assign({},x);delete keep.id;delete keep.tripId;
      ref.delete().then(function(){closeSheet();snack('タスクを削除しました',function(){ref.set(keep).catch(fail)})}).catch(fail)};
  });
}

    color:(ev&&ev.color)||EV_COLORS[0],who:((ev&&ev.who)||[]).slice(),memo:ev?ev.memo||'':'',place:ev?ev.place||'':'',url:ev?ev.url||'':'',repeat:ev?ev.repeat||'':''};

    var keep=function(){st.title=ti.value;st.start=g('ev_s').value;st.end=g('ev_e').value;st.t1=g('ev_t1').value;st.t2=g('ev_t2').value;

    S.events.slice().sort(function(a,b){return a.start<b.start?1:-1}).forEach(function(x){var k=(x.title||'').trim();if(k&&!seen[k]){seen[k]=1;past.push(x)}});
    var showHist=function(){

        tStart:allDay?'':st.t1,tEnd:allDay?'':st.t2,time:allDay?'':evTimeStr(st.t1,st.t2)};

    };

      var label=document.getElementById('pk_label').value.trim(),g=document.getElementById('pk_g').value.trim()||'その他';
      if(!label){toast('名前を入力してください');return}
      col('pack').doc(p.id).update({label:label,g:g,who:document.getElementById('pk_who').value}).then(function(){closeSheet();toast('保存しました')}).catch(fail);
    };
    var del=document.getElementById('pk_del');
    del.onclick=function(){if(!del.classList.contains('sure')){del.classList.add('sure');del.textContent='本当に削除する';return}
      col('pack').doc(p.id).delete().then(function(){closeSheet();toast('削除しました')}).catch(fail)};
  });
}
function todoSheet(x){
  var h='<h2>やることを編集</h2><div class="f"><label for="td_text">内容</label><input class="in" id="td_text" value="'+esc(x.text)+'"></div>'+
   '<div class="acts"><button class="btn line" data-close>閉じる</button><button class="btn" id="td_save">保存する</button></div><button class="btn warn" id="td_del">削除する</button>';
  openSheet(h,function(){
    document.getElementById('td_save').onclick=function(){var v=document.getElementById('td_text').value.trim();if(!v){toast('内容を入力してください');return}
      col('todos').doc(x.id).update({text:v}).then(function(){closeSheet();toast('保存しました')}).catch(fail)};
    var del=document.getElementById('td_del');
    del.onclick=function(){if(!del.classList.contains('sure')){del.classList.add('sure');del.textContent='本当に削除する';return}
      col('todos').doc(x.id).delete().then(function(){closeSheet();toast('削除しました')}).catch(fail)};
  });
}
/* ---------- sheets ---------- */
var sheetTok=0;
function closeSheet(){
  var sc=document.getElementById('scrim');if(!sc){sheetRoot.innerHTML='';return}
  var tok=++sheetTok;sc.classList.add('closing');sc.id='';
  setTimeout(function(){if(tok===sheetTok&&sc.parentNode)sheetRoot.innerHTML='';else if(sc.parentNode)sc.remove();if(gtWait)gtRefresh()},230);
}
function openSheet(html,bind){
  var prev=sheetRoot.querySelector('.scrim'),swap=!!(prev&&!prev.classList.contains('closing'));sheetTok++;
  sheetRoot.innerHTML='<div class="scrim'+(swap?' swap':'')+'" id="scrim"><div class="sheet" role="dialog" aria-modal="true">'+'<span class="grab" aria-hidden="true"></span>'+html+'</div></div>';
  (function(){var sh=sheetRoot.querySelector('.sheet'),g=sh.querySelector('.grab'),y0=null,dy=0;
    var down=function(e){if(e.target!==g&&!(e.target===sh&&e.offsetY<28))return;y0=e.clientY;dy=0;sh.style.transition='none';sh.setPointerCapture&&sh.setPointerCapture(e.pointerId)};
    sh.addEventListener('pointerdown',down);
    sh.addEventListener('pointermove',function(e){if(y0==null)return;dy=Math.max(0,e.clientY-y0);sh.style.transform='translateY('+dy+'px)'});
    var up=function(){if(y0==null)return;y0=null;sh.style.transition='transform .25s cubic-bezier(.2,.9,.3,1)';if(dy>110){sh.style.transform='translateY(100%)';closeSheet()}else sh.style.transform=''};
    sh.addEventListener('pointerup',up);sh.addEventListener('pointercancel',up);})();
  document.getElementById('scrim').onclick=function(e){if(e.target.id==='scrim')closeSheet()};
  var c=sheetRoot.querySelector('[data-close]');if(c)c.onclick=closeSheet;
  bind();var f=sheetRoot.querySelector('input,textarea');if(f&&!sheetRoot.querySelector('.dp'))f.focus();
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sheetRoot.innerHTML)closeSheet()});

function itemSheet(it,date){
  var t=trip(),days=daysOf(t),icon=(it&&it.icon)||'pin',tp=parseTime(it&&it.time);
  var h='<h2>'+(it?'予定を編集':'予定を追加')+'</h2>'+
   '<div class="f"><label for="it_date">日にち</label><select class="in" id="it_date">'+days.map(function(d,i){return '<option value="'+d+'"'+(d===((it&&it.date)||date)?' selected':'')+'>'+(i+1)+'日目 '+jp(d)+'</option>'}).join('')+'</select></div>'+
   '<div class="f"><span class="lab">時間</span><div class="timebox"><input type="time" class="in" id="it_ts" aria-label="開始時刻" value="'+tp.s+'"><span aria-hidden="true">–</span><input type="time" class="in" id="it_te" aria-label="終了時刻（なくても可）" value="'+tp.e+'"></div>'+
   '<div class="qchips"><button type="button" data-q="-15">−15分</button><button type="button" data-q="15">＋15分</button><button type="button" data-q="60">＋1時間</button><label class="qchk" for="it_open"><input type="checkbox" id="it_open"'+(tp.open?' checked':'')+'>以降（〜）</label><button type="button" data-q="clear">時間なし</button></div>'+
   '<input class="in" id="it_tfree" placeholder="時刻の代わりに文字で表示（例：その後）" value="'+esc(tp.free)+'" aria-label="時刻の代わりに表示する文字"></div>'+
   '<div class="f"><label for="it_title">タイトル</label><input class="in" id="it_title" placeholder="例：仁川空港に到着" value="'+esc(it?it.title:'')+'"></div>'+
   '<div class="f"><label for="it_sub">ひとこと</label><input class="in" id="it_sub" placeholder="例：入国審査のあとAREXでソウル駅へ" value="'+esc(it?it.sub:'')+'"></div>'+
   '<div class="f"><label for="it_place">場所（地図に表示）</label><input class="in" id="it_place" placeholder="例：仁川国際空港" value="'+esc(it?it.place:'')+'"></div>'+
   '<div class="two"><div class="f"><label for="it_stay">滞在時間</label><input class="in" id="it_stay" placeholder="例：1時間" value="'+esc(it&&it.stay||'')+'"></div>'+
   '<div class="f"><label for="it_moveby">前の予定からの移動</label><select class="in" id="it_moveby"><option value="">なし</option>'+Object.keys(MOVE).map(function(k){return '<option value="'+k+'"'+(it&&it.moveBy===k?' selected':'')+'>'+MOVE[k]+'</option>'}).join('')+'</select></div></div>'+
   '<div class="f"><label for="it_move">移動時間</label><input class="in" id="it_move" placeholder="例：2時間35分" value="'+esc(it&&it.move||'')+'"></div>'+
   '<div class="f"><span style="font-size:12px;font-weight:700;color:var(--sub)">アイコン</span><div class="icons" role="group" aria-label="アイコン">'+ICONS.map(function(k){return '<button type="button" data-ic="'+k+'" aria-pressed="'+(k===icon)+'" aria-label="'+I[k][0]+'" title="'+I[k][0]+'">'+ic(k)+'</button>'}).join('')+'</div></div>'+
   '<div class="f"><label for="it_note">メモ</label><textarea class="in" id="it_note" placeholder="予約番号や注意点など">'+esc(it?it.note:'')+'</textarea></div>'+
   '<div class="acts"><button class="btn line" data-close>閉じる</button><button class="btn" id="it_save">保存する</button></div>'+
   (it?'<button class="btn warn" id="it_del">この予定を削除</button>':'');
  openSheet(h,function(){
    var ts=document.getElementById('it_ts'),te=document.getElementById('it_te');
    var shift=function(v,m){var x=tmin(v);if(x==null)return v;x=((x+m)%1440+1440)%1440;return ('0'+Math.floor(x/60)).slice(-2)+':'+('0'+x%60).slice(-2)};
    sheetRoot.querySelectorAll('[data-q]').forEach(function(b){b.onclick=function(){var q=b.dataset.q;
      if(q==='clear'){ts.value='';te.value='';document.getElementById('it_open').checked=false;return}
      var m=+q;if(!ts.value){ts.value='09:00';return}ts.value=shift(ts.value,m);if(te.value)te.value=shift(te.value,m)}});
    [ts,te].forEach(function(x){x.addEventListener('input',function(){if(x.value)document.getElementById('it_tfree').value=''})});
    sheetRoot.querySelectorAll('[data-ic]').forEach(function(b){b.onclick=function(){icon=b.dataset.ic;sheetRoot.querySelectorAll('[data-ic]').forEach(function(x){x.setAttribute('aria-pressed',x===b)})}});
    document.getElementById('it_save').onclick=function(){
      var g=function(id){return document.getElementById(id).value.trim()};
      var title=g('it_title');if(!title){toast('タイトルを入力してください');return}
      var d=g('it_date'),s0=g('it_ts'),e0=g('it_te'),free=g('it_tfree'),op=document.getElementById('it_open').checked;
      var time=free||(s0?s0+(e0?'\n– '+e0:(op?'〜':'')):'');
      var order=(it&&it.date===d&&it.time===time)?it.order:placeOrder(d,s0,it&&it.id);
      var body={date:d,time:time,title:title,sub:g('it_sub'),place:g('it_place'),note:document.getElementById('it_note').value.trim(),icon:icon,order:order,stay:g('it_stay'),moveBy:g('it_moveby'),move:g('it_moveby')?g('it_move'):''};
      if(it&&it.place===body.place&&typeof it.lat==='number'){body.lat=it.lat;body.lng=it.lng}
      var ref=it?col('items').doc(it.id):col('items').doc();
      ref.set(body).then(function(){closeSheet();toast('保存しました');S.dayIdx=Math.max(0,days.indexOf(d));if(body.place&&typeof body.lat!=='number')geocode([{id:ref.id,place:body.place}])}).catch(fail);
    };
    var del=document.getElementById('it_del');
    if(del)del.onclick=function(){if(!del.classList.contains('sure')){del.classList.add('sure');del.textContent='本当に削除する';return}
      col('items').doc(it.id).delete().then(function(){closeSheet();toast('削除しました')}).catch(fail)};
  });
}

function tripSheet(t){
  var h='<h2>'+(t?'旅行を編集':'旅行を追加')+'</h2>'+
   '<div class="f"><label for="tr_title">旅行の名前</label><input class="in" id="tr_title" placeholder="例：Seoul Trip" value="'+esc(t?t.title:'')+'"></div>'+
   '<div class="two"><div class="f"><label for="tr_start">出発日</label><input class="in" type="date" id="tr_start" value="'+esc(t?t.start:'')+'"></div>'+
   '<div class="f"><label for="tr_end">帰着日</label><input class="in" type="date" id="tr_end" value="'+esc(t?t.end:'')+'"></div></div>'+
   '<div class="f"><label for="tr_place">行き先</label><input class="in" id="tr_place" placeholder="例：韓国・ソウル" value="'+esc(t?t.place:'')+'"></div>'+
   '<p class="note">名前は筆記体で表示されるため、英字がおすすめです。</p>'+
   '<div class="acts"><button class="btn line" data-close>閉じる</button><button class="btn" id="tr_save">保存する</button></div>'+
   (t?'<button class="btn warn" id="tr_del">この旅行を削除</button>':'');
  openSheet(h,function(){
    document.getElementById('tr_save').onclick=function(){
      var g=function(id){return document.getElementById(id).value.trim()};
      var title=g('tr_title'),s=g('tr_start'),e=g('tr_end')||s;
      if(!title||!s){toast('名前と出発日を入力してください');return}
      if(D(e)<D(s)){toast('帰着日は出発日より後にしてください');return}
      if(daysOf({start:s,end:e}).length>=60){toast('60日以内の日程にしてください');return}
      var body={title:title,start:s,end:e,place:g('tr_place')};
      if(t){col_trips().doc(t.id).update(body).then(function(){closeSheet();toast('保存しました')}).catch(fail)}
      else{var ref=col_trips().doc();body.color=HUES[S.trips.length%HUES.length];body.createdAt=Date.now();
        ref.set(body).then(function(){closeSheet();selectTrip(ref.id);location.hash='itinerary';toast('旅行を追加しました')}).catch(fail)}
    };
    var del=document.getElementById('tr_del');
    if(del)del.onclick=async function(){if(!del.classList.contains('sure')){del.classList.add('sure');del.textContent='本当に削除する（予定・持ち物・写真も消えます）';return}
      try{var id=t.id;for(var n of ['items','pack','photos','memos','todos']){var q=await S.db.collection('trips/'+id+'/'+n).get();for(var d of q.docs){var b=d.data();if(n==='photos'&&S.assets&&b&&b.assetId)S.assets.delete(b.assetId).catch(function(){});await S.db.doc('trips/'+id+'/'+n+'/'+d.id).delete()}}
        await col_trips().doc(id).delete();closeSheet();S.tid=null;LW('tid',null);location.hash='home';toast('削除しました')}catch(e){fail(e)}};
  });
}
function col_trips(){return S.db.collection('trips')}

/* ---------- data ---------- */
function unsubTrip(){subs.forEach(function(u){try{u()}catch(e){}});subs=[]}
function selectTrip(id){
  if(S.tid===id&&subs.length)return;
  unsubTrip();S.tid=id;LW('tid',id);S.items=[];S.pack=[];S.photos=[];S.memos={};S.todos=[];S.dayIdx=0;S.open=null;
  if(!id||!S.db)return;
  var map=function(q){return q.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o})};
  subs.push(col('items').onSnapshot(function(q){S.items=map(q);soon()},function(){}));
  subs.push(col('pack').onSnapshot(function(q){S.pack=map(q);soon()},function(){}));
  subs.push(col('todos').onSnapshot(function(q){S.todos=map(q);gtRefresh()},function(){}));
  subs.push(col('photos').onSnapshot(function(q){S.photos=map(q);soon()},function(){}));
  subs.push(col('memos').onSnapshot(function(q){var m={};q.docs.forEach(function(d){m[d.id]=(d.data()||{}).text||''});S.memos=m;soon()},function(){}));
}

var VIEWS={home:vHome,itinerary:vItinerary,map:vMap,packing:vPacking,calendar:vCalendar};
function cur(){var h=location.hash.slice(1);if(h==='trips')return 'home';if(h==='memories')return 'calendar';return VIEWS[h]?h:'home'}
var splashT0=Date.now(),splashGone=false;
function hideSplash(){if(splashGone)return;splashGone=true;var el=document.getElementById('splash');if(!el)return;
  setTimeout(function(){el.classList.add('out');setTimeout(function(){el.remove()},520)},Math.max(0,1100-(Date.now()-splashT0)))}
setTimeout(hideSplash,4500);
function render(){
  if(S.status!=='loading')hideSplash();
  var v=cur();
  if(S.status==='nodb'){headPlain('Our Trips','旅行アプリ');view.innerHTML='<div class="card empty"><strong>旅行データを読み込めません</strong><p class="note">データの保存先の設定が見つかりません。管理者に連絡してください。</p></div>';fab.hidden=true;return}
  if(S.status==='loading'&&!S.trips.length){view.innerHTML='<div class="card empty"><p class="note">旅行データを読み込んでいます…</p></div>';return}
  if(S.status==='slow'&&!S.trips.length){headPlain('Our Trips','旅行アプリ');view.innerHTML='<div class="card empty"><strong>まだデータに届いていません</strong><p class="note">通信状況を確認して、少しお待ちください。</p></div>';return}
  if(v!=='home'&&v!=='calendar'&&!trip()){if(S.trips.length){selectTrip(S.trips[0].id)}else{v='home'}}
  if(v!=='map'&&v!=='itinerary'&&chart)dropMap();
  VIEWS[v]();
  fab.hidden=true;
  document.querySelectorAll('nav.tabs a').forEach(function(a){if(a.dataset.v===v)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
}
var last=cur();
window.addEventListener('hashchange',function(){if(sheetRoot.innerHTML)closeSheet();if(cur()!==last){last=cur();window.scrollTo(0,0)}render()});

(async function boot(){
  var cl=window.claude;
  if(!cl||!cl.use){S.status='nodb';render();return}
  var r=await Promise.all([cl.use('db'),cl.use('user'),cl.use('sample')]);
  S.db=r[0];var user=r[1];S.sample=r[2];
  if(!S.db){S.status='nodb';render();return}
  if(user&&user.can){try{var w=await user.can('data.write');if(w===false)S.canWrite=false}catch(e){}}
  S.db.collection('members').onSnapshot(function(q){S.members=q.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o}).sort(function(a,b){return (a.order||0)-(b.order||0)});soon()},function(){});
  S.db.collection('events').onSnapshot(function(q){S.events=q.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});soon()},function(){});
  var timer=setTimeout(function(){if(S.status==='loading'){S.status='slow';render()}},10000);
  col_trips().orderBy('start','desc').onSnapshot(function(q){
    setTimeout(syncTodoSubs,0);
    S.trips=q.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});
    if(!q.metadata.fromCache){clearTimeout(timer);S.status='ready'}
    if(S.tid&&!trip()&&!q.metadata.fromCache){S.tid=null}
    if(!S.tid&&S.trips.length)selectTrip(S.trips[0].id);else if(S.tid&&!subs.length)selectTrip(S.tid);
    soon();
  },function(){clearTimeout(timer);S.status='slow';render()});
})();
})();
</script>
