<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1a3a">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="durip-build" content="2026-11-05-8">
<script>
/* load the newest version: if the server copy is newer than this one, reload */
(function(){
  function check(){
    var mine=(document.querySelector('meta[name="durip-build"]')||{}).content;
    fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.text()}).then(function(t){
      var m=/name="durip-build" content="([^"]+)"/.exec(t);
      if(m&&mine&&m[1]!==mine){
        try{if(sessionStorage.getItem('durip-rl')===m[1])return;sessionStorage.setItem('durip-rl',m[1])}catch(e){}
        location.replace(location.pathname+'?v='+m[1]+location.hash);
      }
    }).catch(function(){});
  }
  check();
  /* no pinch / double-tap zoom on iPhone */
  ['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault()},{passive:false})});
  var lastT=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-lastT<300&&!(e.target.closest&&e.target.closest('input,textarea,select')))e.preventDefault();lastT=n},{passive:false});
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')check()});
})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Durip">
<meta name="application-name" content="Durip">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Durip</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Allura&display=swap">
<style>
/* Layout: phone app — starry header, scrolling content, fixed bottom tab bar, bottom sheet for editing. Single light look (matches the mock). */
:root{
  --sky:#0b1a3a; --sky2:#1b3466; --navy:#163a6b; --ink:#12284d; --sub:#5b6b85; --mute:#8a97ab;
  --bg:#f4f6fa; --card:#ffffff; --pill:#dfe9f6; --soft:#eef3fa; --line:#e6ebf2; --coral:#e8796a; --peach:#fbe3da; --danger:#b3261e;
  --display:'Allura',cursive; --body:'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif;
  color-scheme:light;
}
html,body{height:100%}
html{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}
*{touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sky)}
button,input,textarea,select{font-family:inherit;color:inherit;font-size:15px}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.app{background:var(--bg);min-height:100%;display:flex;flex-direction:column;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.sky{color:#fff;background-color:var(--sky);background-image:linear-gradient(180deg,#0a1633 0%,var(--sky2) 100%)}
header.sky{position:relative;padding-block:28px 34px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.hin{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.script{font-family:var(--display);font-size:34px;line-height:1.1;padding-right:52px;text-wrap:balance}
.hdate{font-size:20px;font-weight:500;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.hsub{font-size:14px;opacity:.9;display:flex;align-items:center;gap:6px}
.fab[hidden]{display:none}
.mapc.lf{display:block;padding:0;position:relative;z-index:0}
.pinm span{display:flex;width:30px;height:30px;border-radius:50%;background:#163a6b;color:#fff;font:700 13px/1 'Noto Sans JP',sans-serif;align-items:center;justify-content:center;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3);box-sizing:border-box}
.pinm.last span{background:#e8796a}
.leaflet-container{font-family:inherit}
.rtinfo{background:#fff;color:#12284d;font:700 12px/1 'Noto Sans JP',sans-serif;padding:7px 10px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.splash{position:fixed;inset:0;z-index:100;background:linear-gradient(180deg,#1b3466,#0b1a3a);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;font-family:'Noto Sans JP','Hiragino Sans',system-ui,sans-serif}
.spl-ic{width:116px;height:116px;animation:splpop .7s cubic-bezier(.2,1.4,.4,1) both}
.spl-pl{animation:splfly 1.1s cubic-bezier(.3,.9,.3,1) both;transform-origin:300px 196px}
.spl-trail{animation:spltr 1.1s ease-out both}
.spl-t{font-size:40px;font-weight:700;letter-spacing:.02em;line-height:1;animation:splup .6s .18s cubic-bezier(.2,.9,.3,1) both}
.spl-s{font-size:13px;font-weight:500;opacity:.7;letter-spacing:.2em;animation:splup .6s .3s cubic-bezier(.2,.9,.3,1) both}
.splash.out{animation:splout .5s cubic-bezier(.4,0,.2,1) forwards}
.splash.out .spl-pl{animation:splaway .5s ease-in forwards}
@keyframes splpop{from{opacity:0;transform:scale(.7)}}
@keyframes splfly{from{opacity:0;transform:translate(-70px,60px)}}
@keyframes spltr{from{opacity:0}}
@keyframes splup{from{opacity:0;transform:translateY(10px)}}
@keyframes splout{to{opacity:0;transform:scale(1.06);visibility:hidden}}
@keyframes splaway{to{transform:translate(90px,-80px);opacity:0}}
@media (prefers-reduced-motion:reduce){.splash *,.splash{animation-duration:.01s!important;animation-delay:0s!important}}
/* fade the app in after the splash */
.app,nav.tabs{opacity:0;transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.2,1);animation:appsafe .01s 7s forwards}
.app{transform:translateY(14px)}
body.shown .app,body.shown nav.tabs{opacity:1;transform:none}
@keyframes appsafe{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.app{transform:none}.app,nav.tabs{transition-duration:.2s}}
/* home: trips as a schedule */
.tl2{list-style:none;margin:0;padding:4px 0}
.tl2 li{margin:0}
.tl2-r{display:flex;align-items:stretch;width:100%;border:0;background:none;text-align:left;cursor:pointer;color:var(--ink);padding:0 14px 0 4px}
.tl2-d{flex:none;width:58px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;padding:14px 0;font-variant-numeric:tabular-nums;line-height:1.2}
.tl2-d b{font-size:18px;font-weight:700}
.tl2-d small{font-size:11px;color:var(--sub)}
.tl2-l{flex:none;width:30px;position:relative}
.tl2-l::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px solid #cdd6e3}
.tl2 li:first-child .tl2-l::before{top:50%}
.tl2 li:last-child .tl2-l::before{bottom:50%}
.tl2 li:only-child .tl2-l::before{display:none}
.tl2-l i{position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:50%;background:var(--c);transform:translate(-50%,-50%);box-shadow:0 0 0 3px var(--card)}
.tl2-x{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding:14px 0;border-bottom:1px solid var(--line)}
.tl2 li:last-child .tl2-x{border-bottom:0}
.tl2-r .chev{align-self:center;color:var(--mute);margin-left:8px}
.tl2-r.past{opacity:.5}
/* packing: Google Tasks style */
.pk-tabs{display:flex;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg)}
.pk-tabs::-webkit-scrollbar{display:none}
.pk-tabs button{flex:none;display:flex;align-items:center;gap:6px;min-height:48px;padding:0 14px;border:0;border-bottom:3px solid transparent;background:none;color:var(--sub);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.pk-tabs button[aria-selected="true"]{color:#2463b0;border-bottom-color:#2463b0}
.pk-tn{max-width:9em;overflow:hidden;text-overflow:ellipsis}
.pk-bd{min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;border-radius:999px;background:var(--line);color:var(--sub);font-size:12px;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.pk-tabs button[aria-selected="true"] .pk-bd{background:#dbe7fb;color:#2463b0}
.pk-tabs .pk-tadd{color:var(--navy)}
.pk-list{margin-bottom:76px;display:flex;flex-direction:column;gap:8px}
.pk-hd{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;padding:14px 16px 4px}
.pk-hd h2{margin:0;font-size:18px}
.pk-empty{padding:8px 16px 14px;margin:0}
.pk-row{display:flex;align-items:flex-start;gap:2px;padding:2px 2px 2px 6px;transition:opacity .25s,transform .25s}
.pk-row.leaving{opacity:0;transform:translateX(16px)}
.pk-row .gt-c{margin-top:2px}
.pk-b{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px;border:0;background:none;text-align:left;padding:12px 2px;cursor:pointer;color:var(--ink)}
.pk-t{font-size:16px;overflow-wrap:anywhere}
.pk-m{font-size:13px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.pk-row.done .pk-t{color:var(--mute);text-decoration:line-through}
.pk-star{flex:none;width:44px;height:44px;margin-top:2px;border:0;background:none;color:#9aa6b8;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%}
.pk-star.on{color:#2463b0}
.pk-fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:7;width:60px;height:60px;border-radius:18px;border:0;background:#c9dafa;color:#173b78;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(18,40,77,.22);cursor:pointer;transition:transform .2s}
.pk-fab[hidden]{display:none}
body:has(.snack) .pk-fab{transform:translateY(-62px)}
.pk-ev{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;color:var(--ink)}
.pk-ev:last-child{border-bottom:0}
.pk-evd{flex:none;width:60px;display:flex;flex-direction:column;font-size:12px;font-weight:700;color:var(--navy)}
.pk-evd small{font-weight:500;color:var(--sub)}
.pk-evt{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}

.apph{flex-direction:row!important;align-items:flex-end;justify-content:space-between;gap:12px}
.apph-t{display:flex;flex-direction:column;gap:4px;min-width:0}
.apph-e{font-size:12px;font-weight:500;opacity:.75;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.apph h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.01em;line-height:1.2}
.apph-b{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
header.sky:has(.apph){padding-block:22px 34px}
.hbtn{position:absolute;top:22px;right:max(14px,env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none}
main{flex:1;margin-top:-18px;background:var(--bg);border-radius:20px 20px 0 0;padding-block:16px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.seg{align-self:center;display:flex;gap:2px;max-width:100%;overflow-x:auto;background:var(--pill);border-radius:999px;padding:3px}
.seg button{flex:none;min-width:96px;height:40px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:var(--navy);font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.chip{align-self:flex-start;background:var(--pill);color:var(--navy);font-size:14px;font-weight:700;padding:5px 14px;border-radius:999px;margin:0}
.row{display:grid;grid-template-columns:78px minmax(0,1fr);gap:6px}
.time{background:var(--card);border-radius:12px;display:flex;align-items:center;padding:0 8px 0 12px;font-weight:700;font-size:14px;white-space:pre-line;font-variant-numeric:tabular-nums;line-height:1.25}
.item{background:var(--card);border:0;border-radius:12px;min-height:62px;display:flex;align-items:center;gap:12px;padding:8px 12px;text-align:left;cursor:pointer;width:100%}
.ico{flex:none;width:34px;height:34px;border-radius:10px;background:var(--soft);color:var(--navy);display:flex;align-items:center;justify-content:center}
.ico svg{width:20px;height:20px}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.t1{font-weight:700}.t2{font-size:12.5px;color:var(--sub);overflow-wrap:anywhere}
.chev{flex:none;color:var(--navy);transition:transform .2s}
.item[aria-expanded="true"] .chev{transform:rotate(90deg)}
.detail{grid-column:2;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6;display:flex;flex-direction:column;gap:8px;overflow-wrap:anywhere}
.link{background:none;border:0;padding:0;color:var(--navy);font-weight:700;font-size:13px;text-decoration:underline;cursor:pointer;align-self:flex-start;min-height:32px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--peach);color:var(--ink);border-radius:999px;padding:12px 18px;font-weight:700;font-size:14px;text-decoration:none;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(18,40,77,.18);z-index:5}
.card{background:var(--card);border-radius:16px;box-shadow:0 1px 4px rgba(18,40,77,.06)}
.btn{min-height:48px;border-radius:14px;border:0;background:var(--navy);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;cursor:pointer;padding:0 16px}
.btn.ghost{background:transparent;border:1.5px dashed #9fb1c9;color:var(--navy)}
.btn.line{background:var(--card);border:1.5px solid var(--line);color:var(--navy)}
.btn.warn{background:var(--card);border:1.5px solid var(--danger);color:var(--danger)}
.btn.warn.sure{background:var(--danger);color:#fff}
.note{font-size:12px;color:var(--sub);margin:0}
.empty{padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
/* trips list */
.trip{display:flex;align-items:center;gap:14px;padding:14px 16px;border:0;width:100%;text-align:left;cursor:pointer}
.trip .badge{flex:none;width:52px;height:52px;border-radius:14px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.trip .badge small{font-size:10px;font-weight:500;opacity:.85}
.cur{font-size:11px;font-weight:700;color:var(--coral)}
/* map */
.stop{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.stop:last-child{border-bottom:0}
.num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.stop:last-child .num{background:var(--coral)}
.out{flex:none;color:var(--navy);width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px}
.route{position:relative;height:120px;border-radius:16px;overflow:hidden;background:#e3ebf2}
.route svg{position:absolute;inset:0;width:100%;height:100%}
/* packing */
.prog{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden}
.bar div{height:100%;border-radius:4px;background:#f6c9b8;transition:width .3s}
.check{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 6px 0 16px;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:20px;height:20px;accent-color:var(--navy);margin:0;flex:none}
.check .lb{flex:1;min-width:0;overflow-wrap:anywhere}
.check input:checked + .lb{color:#9aa6b8;text-decoration:line-through}
.who{font-size:11px;color:var(--sub)}
.del{border:0;background:none;color:var(--mute);width:40px;height:40px;border-radius:8px;cursor:pointer;font-size:18px}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:8px}
/* memories */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#dfe6ef;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(11,26,58,.6);color:#fff;cursor:pointer}
.addph{position:relative;aspect-ratio:1;border-radius:10px;border:1.5px dashed #9fb1c9;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;color:var(--navy);cursor:pointer;font-size:11px}
.addph input{position:absolute;width:1px;height:1px;opacity:0}
/* forms */
.f{display:flex;flex-direction:column;gap:6px}
.f label{font-size:12px;font-weight:700;color:var(--sub)}
.in{width:100%;box-sizing:border-box;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}
textarea.in{min-height:84px;resize:vertical;line-height:1.6}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.icons{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.icons button{aspect-ratio:1;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--navy);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.icons button svg{width:20px;height:20px}
.icons button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(11,26,58,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88%;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding-block:12px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
.scrim{animation:scin .22s ease-out}
.scrim .sheet{animation:shup .38s cubic-bezier(.18,.95,.32,1.08)}
.scrim.swap,.scrim.swap .sheet{animation:none}
.scrim.closing{animation:scout .23s ease-in forwards;pointer-events:none}
.scrim.closing .sheet{animation:shdown .23s ease-in forwards}
@keyframes scin{from{background:rgba(11,26,58,0)}}
@keyframes scout{to{background:rgba(11,26,58,0)}}
@keyframes shup{from{transform:translateY(100%)}}
@keyframes shdown{to{transform:translateY(100%)}}
.grab{width:44px!important;height:5px!important;padding:0!important;border-radius:3px!important;margin:2px 0 4px;position:relative;touch-action:none;cursor:grab;align-self:center;width:40px;height:4px;border-radius:2px;background:#cbd5e2}
.sheet h2{margin:0;font-size:18px}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
/* tab bar */
.next{position:relative;overflow:hidden;padding:20px 20px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:6px 14px;border:0;text-align:left;cursor:pointer;width:100%;color:#fff;border-radius:20px;box-shadow:0 10px 26px rgba(11,26,58,.25)}
.next .eyebrow{grid-column:1/-1;font-size:11px;font-weight:700;letter-spacing:.18em;opacity:.75}
.next .nt{display:flex;flex-direction:column;gap:4px;min-width:0}
.next .nm{font-family:var(--display);font-size:32px;line-height:1.05;overflow-wrap:anywhere}
.next .nd{font-size:12.5px;opacity:.85;font-variant-numeric:tabular-nums}
.next .cd{display:flex;flex-direction:column;align-items:center;justify-content:center;width:92px;height:92px;border-radius:50%;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}

function dpSheet(init,onDone){
  var t0=todayS(),sel=init.due||t0,time=init.dueTime||'',rep=init.repeat||'',vd=D(sel),vy=vd.getFullYear(),vm=vd.getMonth(),showTime=!!time;
  var draw=function(){

    for(var i=0;i<42;i++){var d=new Date(start);d.setDate(start.getDate()+i);var ds=iso(d);
      g+='<button type="button" class="dp-d'+(d.getMonth()!==vm?' out':'')+(ds===t0?' today':'')+(ds===sel?' sel':'')+'" data-dp="'+ds+'" aria-label="'+jp(ds)+'"'+(ds===sel?' aria-pressed="true"':'')+'>'+d.getDate()+'</button>'}

    sheetRoot.querySelector('.dp-g').innerHTML=g;
    sheetRoot.querySelectorAll('[data-dp]').forEach(function(b){b.onclick=function(){sel=b.dataset.dp;var x=D(sel);vy=x.getFullYear();vm=x.getMonth();draw()}});
    var tb=sheetRoot.querySelector('.dp-time');

    var tbtn=document.getElementById('dp_tb');if(tbtn)tbtn.onclick=function(){showTime=true;time=time||'09:00';draw();var ti=document.getElementById('dp_t');if(ti)ti.focus()};
    var ti=document.getElementById('dp_t');if(ti)ti.oninput=function(){time=ti.value};

    '<div class="dp-w">'+WD.map(function(w){return '<span>'+w+'</span>'}).join('')+'</div><div class="dp-g"></div>'+
    '<div class="dp-row"><span class="dp-ic">'+GT_CLOCK+'</span><div class="dp-time"></div></div>'+
    '<div class="dp-row"><span class="dp-ic">'+GT_REP.replace('width="14" height="14"','width="18" height="18"')+'</span><select class="in dp-rep" id="dp_r" aria-label="繰り返し">'+Object.keys(REPEAT).map(function(k){return '<option value="'+k+'"'+(k===rep?' selected':'')+'>'+(k?REPEAT[k]:'繰り返し')+'</option>'}).join('')+'</select></div>'+
    '<div class="dp-a">'+(init.due?'<button type="button" class="dp-b" id="dp_clr">日付を削除</button>':'<span></span>')+'<span style="display:flex;gap:8px"><button type="button" class="dp-b" data-close>キャンセル</button><button type="button" class="dp-b pri" id="dp_ok">完了</button></span></div></div>';
  openSheet(h,function(){

/* tasks of every trip, for the calendar */
var allTd={},tdSubs={};
function syncTodoSubs(){
  if(!S.db)return;
  var ids=S.trips.map(function(t){return t.id});
  ids.forEach(function(id){if(tdSubs[id])return;
    tdSubs[id]=S.db.collection('trips/'+id+'/todos').onSnapshot(function(q){allTd[id]=q.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;o.tripId=id;return o});if(cur()==='calendar')soon()},function(){})});
  Object.keys(tdSubs).forEach(function(id){if(ids.indexOf(id)<0){try{tdSubs[id]()}catch(e){}delete tdSubs[id];delete allTd[id]}});
}
function taskOn(x,d){if(!x.due||d<x.due)return false;if(d===x.due)return true;
  var a=D(x.due),b=D(d);
  if(x.repeat==='daily')return true;
  if(x.repeat==='weekly')return a.getDay()===b.getDay();
  if(x.repeat==='monthly')return a.getDate()===b.getDate();
  if(x.repeat==='yearly')return a.getDate()===b.getDate()&&a.getMonth()===b.getMonth();
  return false}
/* ---- elastic overscroll at the top and bottom ---- */
(function(){
  var app=document.querySelector('main'),y0=null,mode=0,pull=0;app.style.position='relative';app.style.zIndex='1';
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var rub=function(d){var H=window.innerHeight*.5;return (1-1/(d*.55/H+1))*H};
  var atBottom=function(){return window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-1};
  window.addEventListener('touchstart',function(e){
    if(reduce||drag||sheetRoot.innerHTML||e.touches.length>1){y0=null;return}
    y0=e.touches[0].clientY;mode=0;pull=0;app.style.transition='none';
  },{passive:true});
  window.addEventListener('touchmove',function(e){
    if(y0==null||drag)return;
    var dy=e.touches[0].clientY-y0;
    if(mode===0){if(dy>0&&window.scrollY<=0)mode=1;else if(dy<0&&atBottom())mode=-1;else return;y0=e.touches[0].clientY;dy=0}
    pull=mode===1?rub(Math.max(0,dy)):-rub(Math.max(0,-dy));
    if((mode===1&&dy<0)||(mode===-1&&dy>0)){pull=0;mode=0;y0=e.touches[0].clientY}
    app.style.transform=pull?'translateY('+pull+'px)':'';
  },{passive:true});
  var end=function(){if(y0==null)return;y0=null;mode=0;
    if(!pull){app.style.transform='';return}
    pull=0;app.style.transition='transform .5s cubic-bezier(.2,.9,.3,1.12)';app.style.transform='';
    setTimeout(function(){app.style.transition=''},520)};
  window.addEventListener('touchend',end,{passive:true});window.addEventListener('touchcancel',end,{passive:true});
  /* PC: mouse wheel / trackpad */
  var wAcc=0,wT=0,wDir=0;
  var settle=function(){wAcc=0;wDir=0;app.style.transition='transform .55s cubic-bezier(.2,.9,.3,1.15)';app.style.transform='';setTimeout(function(){if(!wAcc)app.style.transition=''},560)};
  window.addEventListener('wheel',function(e){
    if(reduce||drag||sheetRoot.innerHTML||e.ctrlKey||y0!=null)return;
    var dy=e.deltaMode===1?e.deltaY*16:e.deltaY;
    var dir=dy<0&&window.scrollY<=0?1:dy>0&&atBottom()?-1:0;
    if(!dir||(wDir&&dir!==wDir)){if(wAcc)settle();return}
    wDir=dir;wAcc=Math.min(wAcc+Math.abs(dy)*.6,900);
    app.style.transition='transform .08s linear';
    app.style.transform='translateY('+(dir*rub(wAcc)*.6)+'px)';
    clearTimeout(wT);wT=setTimeout(settle,90);
  },{passive:true});
})();

function entriesOn(d){
  var out=[];
  S.trips.forEach(function(t){var e=t.end||t.start;if(t.start<=d&&d<=e)out.push({kind:'trip',id:t.id,title:t.title,start:t.start,end:e,color:t.color||'#163a6b',time:'',memo:t.place||''})});
  S.events.forEach(function(x){var e=x.end||x.start;if(x.start<=d&&d<=e)out.push({kind:'ev',id:x.id,title:x.title,start:x.start,end:e,color:(fixedColor(x.who)||{}).color||x.color||EV_COLORS[0],time:x.time||'',memo:x.memo||'',who:x.who||[]})});
  Object.keys(allTd).forEach(function(tid){var tr=S.trips.filter(function(t){return t.id===tid})[0];
    (allTd[tid]||[]).forEach(function(x){if(taskOn(x,d))out.push({kind:'task',id:tid,td:x.id,title:x.text,start:d,end:d,color:'#2463b0',time:x.dueTime||'',memo:'やること'+(tr?'（'+tr.title+'）':''),done:!!x.done,who:x.who||[]})})});

}

  var hasT=!!tp.s,opt={sub:!!(it&&it.sub),stay:!!(it&&it.stay),move:!!(it&&(it.moveBy||it.move)),icon:false,note:!!(it&&it.note)};
  var acc=function(key,inner,open){return '<div class="tt-acc'+(open?' open':'')+'" data-acc="'+key+'"><div class="tt-acc-in">'+inner+'</div></div>'};
  var f='<div class="tt-row"><span class="tt-i">'+TI.day+'</span><span class="tt-l">日にち</span><select class="tt-pill" id="it_date" aria-label="日にち">'+days.map(function(d,i){return '<option value="'+d+'"'+(d===((it&&it.date)||date)?' selected':'')+'>'+(i+1)+'日目 '+(D(d).getMonth()+1)+'/'+D(d).getDate()+'（'+WD[D(d).getDay()]+'）</option>'}).join('')+'</select></div>'+
    '<div class="tt-row"><span class="tt-i">'+TI.day.replace('<path d="M12 7v5l3 2"/>','<path d="M12 7v5l3 2"/>')+'</span><label class="tt-l" for="it_hast">時間を決める</label><input type="checkbox" role="switch" class="tgl" id="it_hast"'+(hasT?' checked':'')+'></div>'+
    acc('time','<div class="tt-row sub" style="border-bottom:1px solid var(--line)"><span class="tt-l">時刻</span><span class="tt-dt"><input type="time" class="tt-pill tm" id="it_ts" value="'+(tp.s||'09:00')+'" aria-label="開始時刻"><span aria-hidden="true" style="color:var(--sub)">〜</span><input type="time" class="tt-pill tm" id="it_te" value="'+tp.e+'" aria-label="終了時刻（なくても可）"></span></div>',hasT)+
    '<div class="tt-row"><span class="tt-i">'+TI.pin+'</span><input class="tt-in" id="it_place" placeholder="場所を追加（地図に表示されます）" value="'+esc(it?it.place:'')+'" autocomplete="off"></div>'+
    acc('sub','<div class="tt-row"><span class="tt-i">'+TI.memo+'</span><input class="tt-in" id="it_sub" placeholder="ひとこと（例：入国審査のあとソウル駅へ）" value="'+esc(it?it.sub:'')+'"></div>',opt.sub)+
    acc('stay','<div class="tt-row"><span class="tt-i">'+TI.day+'</span><span class="tt-l" style="flex:none">滞在</span><input class="tt-in" id="it_stay" placeholder="例：1時間" value="'+esc(it&&it.stay||'')+'"></div>',opt.stay)+
    acc('move','<div class="tt-row"><span class="tt-i">'+ic('car')+'</span><select class="tt-pill" id="it_moveby" aria-label="前の予定からの移動手段">'+Object.keys(MOVE).map(function(k){return '<option value="'+k+'"'+((it&&it.moveBy||'car')===k?' selected':'')+'>'+MOVE[k]+'</option>'}).join('')+'</select><input class="tt-in" id="it_move" placeholder="移動時間（例：2時間35分）" value="'+esc(it&&it.move||'')+'"></div>',opt.move)+
    acc('icon','<div class="tt-pn" style="padding-left:0"><div class="icons" role="group" aria-label="アイコン">'+ICONS.map(function(k){return '<button type="button" data-ic="'+k+'" aria-pressed="'+(k===icon)+'" aria-label="'+I[k][0]+'" title="'+I[k][0]+'">'+ic(k)+'</button>'}).join('')+'</div></div>',opt.icon)+
    acc('note','<div class="tt-row top"><span class="tt-i">'+TI.memo+'</span><textarea class="tt-in" id="it_note" placeholder="メモ（予約番号や注意点など）" rows="3">'+esc(it?it.note:'')+'</textarea></div>',opt.note)+
    '<div class="tt-row top"><span class="tt-i" style="padding-top:8px">'+TI.plus+'</span><div class="tt-chips">'+
      [['sub','ひとこと',TI.memo],['stay','滞在時間',TI.day],['move','移動',ic('car')],['icon','アイコン','<span class="tt-ic-now">'+ic(icon)+'</span>'],['note','メモ',TI.memo]].map(function(a){return '<button type="button" class="tt-chip'+(opt[a[0]]?' gone':'')+'" data-add="'+a[0]+'">'+a[2]+a[1]+'</button>'}).join('')+'</div></div>'+
    (it?'<button type="button" class="tt-del" id="it_del">この予定を削除</button>':'');
  var h='<div class="ttw"><div class="tt-top"><button type="button" class="tt-x" data-close aria-label="閉じる">'+TI.x+'</button><button type="button" class="tt-save" id="it_save">保存</button></div>'+
    '<div class="tt-trow"><span class="tt-tic" id="it_icnow">'+ic(icon)+'</span><input class="tt-title" id="it_title" placeholder="予定のタイトル" aria-label="タイトル" autocomplete="off" value="'+esc(it?it.title:'')+'"></div>'+
    '<div class="tt-form">'+f+'</div></div>';
  openSheet(h,function(){
    sheetRoot.querySelector('.sheet').classList.add('full');
    var g=function(id){return document.getElementById(id)},root=sheetRoot;
    var setAcc=function(k,on){var a=root.querySelector('[data-acc="'+k+'"]');if(a)a.classList.toggle('open',on)};
    g('it_hast').onchange=function(){hasT=this.checked;setAcc('time',hasT)};
    root.querySelectorAll('[data-add]').forEach(function(b){b.onclick=function(){var k=b.dataset.add;opt[k]=true;setAcc(k,true);
      if(k!=='icon')b.classList.add('gone');else{var on=!root.querySelector('[data-acc="icon"]').classList.contains('open');setAcc('icon',!on===false?true:on)}
      var x=g('it_'+(k==='move'?'move':k));if(x&&k!=='icon')setTimeout(function(){x.focus()},200)}});
    root.querySelector('[data-add="icon"]').onclick=function(){var a=root.querySelector('[data-acc="icon"]');setAcc('icon',!a.classList.contains('open'))};
    root.querySelectorAll('[data-ic]').forEach(function(b){b.onclick=function(){icon=b.dataset.ic;root.querySelectorAll('[data-ic]').forEach(function(x){x.setAttribute('aria-pressed',x===b)});
      g('it_icnow').innerHTML=ic(icon);var n=root.querySelector('.tt-ic-now');if(n)n.innerHTML=ic(icon);setTimeout(function(){setAcc('icon',false)},150)}});
    var ti=g('it_title');ti.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){e.preventDefault();ti.blur()}});
    g('it_save').onclick=function(){
      var v=function(id){var x=g(id);return x?x.value.trim():''};
      var title=v('it_title');if(!title){toast('タイトルを入力してください');ti.focus();return}
      var d=v('it_date'),s0=hasT?v('it_ts'):'',e0=hasT?v('it_te'):'';
      var time=s0?s0+(e0?'\n– '+e0:''):(hasT?'':(tp.free&&!tp.s?tp.free:''));
      if(s0&&e0&&e0<s0){toast('終了時刻は開始時刻より後にしてください');return}
      var order=(it&&it.date===d&&it.time===time)?it.order:placeOrder(d,s0,it&&it.id);
      var body={date:d,time:time,title:title,sub:v('it_sub'),place:v('it_place'),note:v('it_note'),icon:icon,order:order,stay:v('it_stay'),moveBy:opt.move?v('it_moveby'):'',move:opt.move?v('it_move'):''};
      if(it&&it.place===body.place&&typeof it.lat==='number'){body.lat=it.lat;body.lng=it.lng}
      var ref=it?col('items').doc(it.id):col('items').doc();
      ref.set(body).then(function(){closeSheet();toast('保存しました');S.dayIdx=Math.max(0,days.indexOf(d));if(body.place&&typeof body.lat!=='number')geocode([{id:ref.id,place:body.place}])}).catch(fail);
    };
    var del=g('it_del');
    if(del)del.onclick=function(){if(!del.classList.contains('sure')){del.classList.add('sure');del.textContent='本当に削除する';return}
      var keep=Object.assign({},it);delete keep.id;var id=it.id;
      col('items').doc(id).delete().then(function(){closeSheet();snack('予定を削除しました',function(){col('items').doc(id).set(keep).catch(fail)})}).catch(fail)};
    if(!it)setTimeout(function(){ti.focus()},380);
  });
}

function tripSheet(t){
  var h='<h2>'+(t?'旅行を編集':'旅行を追加')+'</h2>'+
   '<div class="f"><label for="tr_title">旅行の名前</label><input class="in" id="tr_title" placeholder="例：Seoul Trip" value="'+esc(t?t.title:'')+'"></div>'+
   '<div class="two"><div class="f"><label for="tr_start">出発日</label><input class="in" type="date" id="tr_start" value="'+esc(t?t.start:'')+'"></div>'+
   '<div class="f"><label for="tr_end">帰着日</label><input class="in" type="date" id="tr_end" value="'+esc(t?t.end:'')+'"></div></div>'+
   '<div class="f"><label for="tr_place">行き先</label><input class="in" id="tr_place" placeholder="例：韓国・ソウル" value="'+esc(t?t.place:'')+'"></div>'+
   '<p class="note">名前は筆記体で表示されるため、英字がおすすめです。</p>'+
   '<div class="acts"><button class="btn line" data-close>閉じる</button><button class="btn" id="tr_save">保存する</button></div>'+
   (t?'<button class="btn warn" id="tr_del">この旅行を削除</button>':'');
  openSheet(h,function(){
    document.getElementById('tr_save').onclick=function(){
      var g=function(id){return document.getElementById(id).value.trim()};
      var title=g('tr_title'),s=g('tr_start'),e=g('tr_end')||s;
      if(!title||!s){toast('名前と出発日を入力してください');return}
      if(D(e)<D(s)){toast('帰着日は出発日より後にしてください');return}
      if(daysOf({start:s,end:e}).length>=60){toast('60日以内の日程にしてください');return}
      var body={title:title,start:s,end:e,place:g('tr_place')};
      if(t){col_trips().doc(t.id).update(body).then(function(){closeSheet();toast('保存しました')}).catch(fail)}
      else{var ref=col_trips().doc();body.color=HUES[S.trips.length%HUES.length];body.createdAt=Date.now();
        ref.set(body).then(function(){closeSheet();selectTrip(ref.id);location.hash='itinerary';toast('旅行を追加しました')}).catch(fail)}
    };
    var del=document.getElementById('tr_del');
    if(del)del.onclick=async function(){if(!del.classList.contains('sure')){del.classList.add('sure');del.textContent='本当に削除する（予定・持ち物・写真も消えます）';return}
      try{var id=t.id;for(var n of ['items','pack','photos','memos','todos']){var q=await S.db.collection('trips/'+id+'/'+n).get();for(var d of q.docs){var b=d.data();if(n==='photos'&&S.assets&&b&&b.assetId)S.assets.delete(b.assetId).catch(function(){});await S.db.doc('trips/'+id+'/'+n+'/'+d.id).delete()}}
        await col_trips().doc(id).delete();closeSheet();S.tid=null;LW('tid',null);location.hash='home';toast('削除しました')}catch(e){fail(e)}};
  });
}
function col_trips(){return S.db.collection('trips')}

/* ---------- data ---------- */
function unsubTrip(){subs.forEach(function(u){try{u()}catch(e){}});subs=[]}
function selectTrip(id){
  if(S.tid===id&&subs.length)return;
  unsubTrip();S.tid=id;LW('tid',id);S.items=[];S.pack=[];S.photos=[];S.memos={};S.todos=[];S.dayIdx=0;S.open=null;
  if(!id||!S.db)return;
  var map=function(q){return q.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o})};
  subs.push(col('items').onSnapshot(function(q){S.items=map(q);soon()},function(){}));
  subs.push(col('pack').onSnapshot(function(q){S.pack=map(q);soon()},function(){}));
  subs.push(col('todos').onSnapshot(function(q){S.todos=map(q);gtRefresh()},function(){}));
  subs.push(col('photos').onSnapshot(function(q){S.photos=map(q);soon()},function(){}));
  subs.push(col('memos').onSnapshot(function(q){var m={};q.docs.forEach(function(d){m[d.id]=(d.data()||{}).text||''});S.memos=m;soon()},function(){}));
}

var VIEWS={home:vHome,itinerary:vItinerary,map:vMap,packing:vPacking,calendar:vCalendar};
function cur(){var h=location.hash.slice(1);if(h==='trips')return 'home';if(h==='memories')return 'calendar';return VIEWS[h]?h:'home'}
var splashT0=Date.now(),splashGone=false;
function hideSplash(){if(splashGone)return;splashGone=true;var el=document.getElementById('splash');if(!el)return;
  setTimeout(function(){el.classList.add('out');setTimeout(function(){document.body.classList.add('shown')},120);setTimeout(function(){el.remove()},520)},Math.max(0,1100-(Date.now()-splashT0)))}
setTimeout(hideSplash,4500);
function render(){
  if(S.status!=='loading')hideSplash();
  var pf0=document.getElementById('pkFab');if(pf0)pf0.hidden=true;
  var v=cur();
  if(S.status==='nodb'){headApp('Durip');view.innerHTML='<div class="card empty"><strong>旅行データを読み込めません</strong><p class="note">データの保存先の設定が見つかりません。管理者に連絡してください。</p></div>';fab.hidden=true;return}
  if(S.status==='loading'&&!S.trips.length){view.innerHTML='<div class="card empty"><p class="note">旅行データを読み込んでいます…</p></div>';return}
  if(S.status==='slow'&&!S.trips.length){headApp('Durip');view.innerHTML='<div class="card empty"><strong>まだデータに届いていません</strong><p class="note">通信状況を確認して、少しお待ちください。</p></div>';return}
  if(v!=='home'&&v!=='calendar'&&!trip()){if(S.trips.length){selectTrip(S.trips[0].id)}else{v='home'}}
  if(v!=='map'&&v!=='itinerary'&&chart)dropMap();
  VIEWS[v]();
  fab.hidden=true;
  if(v==='packing'&&S.canWrite&&trip())pkFab().hidden=false;
  document.querySelectorAll('nav.tabs a').forEach(function(a){if(a.dataset.v===v)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
}
var last=cur();
var TAB_ORDER=['home','itinerary','map','packing','calendar'];
function tabAnim(from,to){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var dir=TAB_ORDER.indexOf(to)>TAB_ORDER.indexOf(from)?1:-1;
  var a=document.querySelector('nav.tabs a[data-v="'+to+'"]');if(a){a.classList.remove('pop');void a.offsetWidth;a.classList.add('pop')}
  if(view.animate)view.animate([{opacity:0,transform:'translateX('+(dir*24)+'px)'},{opacity:1,transform:'none'}],{duration:320,easing:'cubic-bezier(.2,.8,.2,1)'});
  if(hdr.animate)hdr.animate([{opacity:.4},{opacity:1}],{duration:260,easing:'ease-out'});
}
window.addEventListener('hashchange',function(){if(sheetRoot.innerHTML)closeSheet();var from=last,moved=cur()!==last;if(moved){last=cur();window.scrollTo(0,0)}render();if(moved)tabAnim(from,last)});

(async function boot(){
  var cl=window.claude;
  if(!cl||!cl.use){S.status='nodb';render();return}
  var r=await Promise.all([cl.use('db'),cl.use('user'),cl.use('sample')]);
  S.db=r[0];var user=r[1];S.sample=r[2];
  if(!S.db){S.status='nodb';render();return}
  if(user&&user.can){try{var w=await user.can('data.write');if(w===false)S.canWrite=false}catch(e){}}
  S.db.collection('members').onSnapshot(function(q){S.members=q.docs.filter(function(d){return d.id.charAt(0)!=='_'}).map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o}).sort(function(a,b){return (a.order||0)-(b.order||0)});soon()},function(){});
  S.db.collection('events').onSnapshot(function(q){S.events=q.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});soon()},function(){});
  var timer=setTimeout(function(){if(S.status==='loading'){S.status='slow';render()}},10000);
  col_trips().orderBy('start','desc').onSnapshot(function(q){
    setTimeout(syncTodoSubs,0);
    S.trips=q.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o});
    if(!q.metadata.fromCache){clearTimeout(timer);S.status='ready'}
    if(S.tid&&!trip()&&!q.metadata.fromCache){S.tid=null}
    if(!S.tid&&S.trips.length)selectTrip(S.trips[0].id);else if(S.tid&&!subs.length)selectTrip(S.tid);
    soon();
  },function(){clearTimeout(timer);S.status='slow';render()});
})();
})();
</script>
