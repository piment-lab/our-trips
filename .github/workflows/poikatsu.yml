name: poikatsu-update
on:
  workflow_dispatch:
  push:
    paths: ['index.html', 'poikatsu/*.js', '.github/workflows/poikatsu.yml']
  schedule:
    - cron: '7 21 * * *'   # 毎朝 6:07（日本時間）
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node poikatsu/build.js
      - run: |
          if [ "${{ github.event_name }}" != "push" ] || git diff --name-only ${{ github.event.before }} HEAD | grep -qE 'poikatsu/fetch.js|poikatsu.yml'; then node poikatsu/fetch.js; else echo "データ取得はスキップ"; fi
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add poikatsu
          git diff --cached --quiet || (git commit -m "ポイ活データを更新" && git pull --rebase && git push)
