name: poikatsu-update
on:
  workflow_dispatch:
  push:
    paths: ['poikatsu/*.js', '.github/workflows/poikatsu.yml']
  schedule:
    - cron: '7 21 * * *'   # 毎朝 6:07（日本時間）
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node poikatsu/fetch.js
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add poikatsu
          git diff --cached --quiet || (git commit -m "ポイ活データを更新" && git pull --rebase && git push)
