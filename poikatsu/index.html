<style>
/* Layout: phone app — starry header, scrolling content, fixed bottom tab bar, bottom sheet for editing. Single light look (matches the mock). */
:root{
  --sky:#0b1a3a; --sky2:#1b3466; --navy:#163a6b; --ink:#12284d; --sub:#5b6b85; --mute:#8a97ab;
  --bg:#f4f6fa; --card:#ffffff; --pill:#dfe9f6; --soft:#eef3fa; --line:#e6ebf2; --coral:#e8796a; --peach:#fbe3da; --danger:#b3261e;

  color-scheme:light;
}
html,body{height:100%}
html{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}

.script{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:.01em;line-height:1.25;padding-right:52px;text-wrap:balance}
.hdate{font-size:20px;font-weight:500;letter-spacing:.02em;font-variant-numeric:tabular-nums}

.pk-fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:7;width:60px;height:60px;border-radius:18px;border:0;background:#c9dafa;color:#173b78;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(18,40,77,.22);cursor:pointer;transition:transform .2s}

.apph{flex-direction:row!important;align-items:flex-end;justify-content:space-between;gap:12px}

.hbtn{position:absolute;top:22px;right:max(14px,env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none}
main{flex:1;margin-top:-18px;background:var(--bg);border-radius:20px 20px 0 0;padding-block:16px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

.item{background:var(--card);border:0;border-radius:12px;min-height:62px;display:flex;align-items:center;gap:12px;padding:8px 12px;text-align:left;cursor:pointer;width:100%}

.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--peach);color:var(--ink);border-radius:999px;padding:12px 18px;font-weight:700;font-size:14px;text-decoration:none;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(18,40,77,.18);z-index:5}

/* packing */
.prog{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}

.sheet{width:100%;max-width:560px;max-height:88%;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding-block:12px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;box-sizing:border-box}

@keyframes scin{from{background:rgba(11,26,58,0)}}
@keyframes scout{to{background:rgba(11,26,58,0)}}

function D(s){var p=String(s||'').split('-');return new Date(+p[0],(+p[1]||1)-1,+p[2]||1)}
function iso(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function dots(s){var d=D(s);return (d.getMonth()+1)+'.'+d.getDate()+' ('+WD[d.getDay()]+')'}
function jp(s){var d=D(s);return (d.getMonth()+1)+'月'+d.getDate()+'日（'+WD[d.getDay()]+'）'}
function daysOf(t){if(!t||!t.start)return[];var a=[],d=D(t.start),e=D(t.end||t.start);for(var i=0;i<60&&d<=e;i++){a.push(iso(d));d.setDate(d.getDate()+1)}return a.length?a:[t.start]}
function parseTime(t){t=String(t||'').replace('\n',' ').trim();var p2=function(x){var a=x.split(':');return ('0'+a[0]).slice(-2)+':'+a[1]};
  var m=/^(\d{1,2}:\d{2})(?:\s*[–-]\s*(\d{1,2}:\d{2}))?\s*(〜)?$/.exec(t);
  if(m)return {s:p2(m[1]),e:m[2]?p2(m[2]):'',open:!!m[3],free:''};
  return {s:'',e:'',open:false,free:t}}
function placeOrder(d,ts,exId){var l=itemsOn(d).filter(function(x){return x.id!==exId});if(!l.length)return 100;
  var t=tmin(ts);if(t==null)return (l[l.length-1].order||0)+100;
  var k=-1;l.forEach(function(x,i){var xm=tmin(x.time);if(xm!=null&&xm<=t)k=i});
  if(k<0)return (l[0].order||0)-100;if(k===l.length-1)return (l[k].order||0)+100;return ((l[k].order||0)+(l[k+1].order||0))/2}
function tmin(s){var m=/^(\d{1,2}):(\d{2})/.exec(s||'');return m?(+m[1])*60+(+m[2]):null}

/* ---------- attachments (stored in the database, images shrunk) ---------- */
function shrinkImg(file){return new Promise(function(res,rej){var r=new FileReader();r.onerror=rej;r.onload=function(){var img=new Image();img.onerror=rej;img.onload=function(){
  var q=.8,m=1600,out;for(var k=0;k<5;k++){var s=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<850000)break;m*=.8;q-=.1}
  res(out)};img.src=r.result};r.readAsDataURL(file)})}
function readUrl(file){return new Promise(function(res,rej){var r=new FileReader();r.onerror=rej;r.onload=function(){res(r.result)};r.readAsDataURL(file)})}
async function addFiles(bid,files){
  for(var i=0;i<files.length;i++){var f=files[i];
    try{var data=/^image\//.test(f.type)?await shrinkImg(f):await readUrl(f);
      if(data.length>900000){toast('「'+f.name+'」は大きすぎて保存できません（約650KBまで）');continue}
      await col('files').add({bid:bid,name:f.name,type:/^image\//.test(f.type)?'image/jpeg':f.type,data:data,at:Date.now()})}catch(e){fail(e)}}
}
function openFile(x){
  if(/^image\//.test(x.type)){var v=document.createElement('div');v.className='imgv';v.innerHTML='<img alt="'+esc(x.name)+'" src="'+x.data+'"><button type="button" aria-label="閉じる">'+TI.x+'</button>';
    v.onclick=function(){v.remove()};document.body.appendChild(v);return}
  try{var b=atob(x.data.split(',')[1]),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
    var url=URL.createObjectURL(new Blob([u],{type:x.type||'application/pdf'}));var a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}catch(e){toast('ファイルを開けませんでした')}
}

function costTotals(){var t={};S.costs.forEach(function(c){t[c.cur||'JPY']=(t[c.cur||'JPY']||0)+(+c.amount||0)});return t}
function costTotalLabel(){var t=costTotals();return Object.keys(t).map(function(c){return money(t[c],c)}).join(' + ')}
function settle(){
  var ms=S.members;if(ms.length<2)return [];var res=[];
  Object.keys(costTotals()).forEach(function(cur){
    var bal={};ms.forEach(function(m){bal[m.id]=0});
    S.costs.filter(function(c){return (c.cur||'JPY')===cur}).forEach(function(c){var a=+c.amount||0,fr=(c.for&&c.for.length?c.for:ms.map(function(m){return m.id})).filter(function(i){return bal[i]!=null});
      if(bal[c.payer]!=null)bal[c.payer]+=a;fr.forEach(function(i){bal[i]-=a/fr.length})});
    var pos=ms.filter(function(m){return bal[m.id]>0.5}).map(function(m){return {id:m.id,v:bal[m.id]}}),neg=ms.filter(function(m){return bal[m.id]<-0.5}).map(function(m){return {id:m.id,v:-bal[m.id]}});
    while(pos.length&&neg.length){var p=pos[0],n=neg[0],x=Math.min(p.v,n.v);res.push({from:n.id,to:p.id,v:Math.round(x),cur:cur});p.v-=x;n.v-=x;if(p.v<0.5)pos.shift();if(n.v<0.5)neg.shift()}
  });
  return res;
}

    '<div class="dp-w">'+WD.map(function(w){return '<span>'+w+'</span>'}).join('')+'</div><div class="dp-g"></div>'+

    '<div class="dp-row"><span class="dp-ic">'+GT_REP.replace('width="14" height="14"','width="18" height="18"')+'</span><select class="in dp-rep" id="dp_r" aria-label="繰り返し">'+Object.keys(REPEAT).map(function(k){return '<option value="'+k+'"'+(k===rep?' selected':'')+'>'+(k?REPEAT[k]:'繰り返し')+'</option>'}).join('')+'</select></div>'+

  });

function poiCalc(it){

  it.max=v.length?Math.max.apply(null,v):it.now;it.avg=v.length?v.reduce(function(a,b){return a+b},0)/v.length:it.now;

  var by=[[],[],[],[],[],[],[]];h.slice(-56).forEach(function(x){by[D(x[0]).getDay()].push(x[1])});
  var da=by.map(function(a){return a.length?a.reduce(function(s,b){return s+b},0)/a.length:0}),srt=da.filter(Boolean).slice().sort(function(a,b){return a-b}),base=srt.length?srt[Math.floor(srt.length/2)]:0;
  it.dow=da;it.hiDow=[];da.forEach(function(a,i){if(base&&by[i].length>=3&&a>=base*1.04)it.hiDow.push(i)});
  if(it.hiDow.length>4)it.hiDow=[];

}

    if(S.tid&&!trip()&&!q.metadata.fromCache){S.tid=null}
    if(!S.tid&&S.trips.length)selectTrip(S.trips[0].id);else if(S.tid&&!subs.length)selectTrip(S.tid);
    soon();
  },function(){clearTimeout(timer);S.status='slow';render()});
})();
})();
